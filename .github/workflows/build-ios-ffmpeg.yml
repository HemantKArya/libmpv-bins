name: Build iOS FFmpeg

on:
  workflow_dispatch:
  workflow_call:

jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Load versions
        run: |
          set -euo pipefail
          tr -d '\r' < config/versions.env > /tmp/versions.env && cp /tmp/versions.env config/versions.env
          set -a; source config/versions.env; set +a
          echo "FFMPEG_IOS_REPO=${FFMPEG_IOS_REPO:-kewlbear/FFmpeg-iOS}" >> "$GITHUB_ENV"
          echo "FFMPEG_IOS_REF=${FFMPEG_IOS_REF:-tool}" >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install nasm yasm pkg-config gnu-tar
          if ! command -v gas-preprocessor.pl &>/dev/null; then
            echo "Installing gas-preprocessor.pl..."
            sudo curl -sSL https://raw.githubusercontent.com/libav/gas-preprocessor/master/gas-preprocessor.pl \
              -o /opt/homebrew/bin/gas-preprocessor.pl 2>/dev/null || \
            sudo curl -sSL https://raw.githubusercontent.com/libav/gas-preprocessor/master/gas-preprocessor.pl \
              -o /usr/local/bin/gas-preprocessor.pl 2>/dev/null || true
            sudo chmod +x /opt/homebrew/bin/gas-preprocessor.pl 2>/dev/null || \
            sudo chmod +x /usr/local/bin/gas-preprocessor.pl 2>/dev/null || true
          fi

      - name: Clone kewlbear/FFmpeg-iOS tool branch
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FFMPEG_IOS_REF" \
            "https://github.com/${FFMPEG_IOS_REPO}.git" tool

      - name: Build FFmpeg XCFrameworks
        working-directory: tool
        run: |
          set -euo pipefail
          echo "Building iOS XCFrameworks via Swift CLI..."
          swift run ffmpeg-ios build

      - name: Collect and validate XCFrameworks
        run: |
          set -euo pipefail
          mkdir -p package/Frameworks package/include

          echo "=== Built Frameworks ==="
          ls -la tool/Frameworks/ || find tool -name '*.xcframework'

          # Find and copy all .xcframework bundles
          find tool -name '*.xcframework' -maxdepth 2 -type d -exec cp -R {} package/Frameworks/ \;

          # Extract headers into package/include for C/C++ direct consumer access
          find package/Frameworks -name 'Headers' -type d | while read -r hdr_dir; do
            FW_NAME=$(basename "$(dirname "$hdr_dir")" .xcframework)
            mkdir -p "package/include/lib${FW_NAME}"
            cp -R "$hdr_dir"/* "package/include/lib${FW_NAME}/" 2>/dev/null || true
          done

          [ -f NOTICE.md ] && cp NOTICE.md package/ || true

          # ── Validate ──
          echo "=== Validating XCFrameworks ==="
          FW_COUNT=$(find package/Frameworks -maxdepth 1 -name '*.xcframework' | wc -l)
          echo "Total xcframeworks: $FW_COUNT"

          if [ "$FW_COUNT" -eq 0 ]; then
            echo "FATAL: No .xcframework bundles found!"
            exit 1
          fi

          for fw in avcodec avformat avutil; do
            if [ ! -d "package/Frameworks/${fw}.xcframework" ]; then
              echo "FATAL: Missing required framework: ${fw}.xcframework"
              exit 1
            fi
          done

          echo "Inspecting avcodec slices:"
          find package/Frameworks/avcodec.xcframework -name '*.a' -o -name 'avcodec' | while read -r bin; do
            echo "Slice $bin:"
            file "$bin" || true
          done

          OUTPUT_FILE="ffmpeg-ios-xcframeworks.tar.gz"
          DEST_PATH="$PWD/${OUTPUT_FILE}"
          cd package
          if command -v gtar &>/dev/null; then
            find . -print0 | sort -z | \
              gtar --create --null --files-from=- \
                  --owner=0 --group=0 --mtime='2024-01-01 00:00:00Z' \
                  --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime \
              | gzip -9n > "$DEST_PATH"
          else
            tar -czf "$DEST_PATH" .
          fi
          cd ..
          ls -lh "${OUTPUT_FILE}"
          if command -v sha256sum &>/dev/null; then
            sha256sum "${OUTPUT_FILE}"
          else
            shasum -a 256 "${OUTPUT_FILE}"
          fi

      - name: Upload iOS FFmpeg artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-ios-xcframeworks
          path: ffmpeg-ios-xcframeworks.tar.gz
          retention-days: 5
          if-no-files-found: error
